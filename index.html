<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes & Notices | Dashboard</title>
    <style>
        :root {
            --bg-deep: #0a0a18;
            --bg-card: rgba(22, 22, 45, 0.75);
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0c8;
            --text-muted: #8888a8;
            --accent-notes: #f0a850;
            --accent-notices: #5b9cf5;
            --accent-notes-glow: rgba(240, 168, 80, 0.25);
            --accent-notices-glow: rgba(91, 156, 245, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-glow-notes: rgba(240, 168, 80, 0.4);
            --border-glow-notices: rgba(91, 156, 245, 0.4);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.35);
            --shadow-card-hover: 0 16px 48px rgba(0, 0, 0, 0.5);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --font-heading: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .bg-animation-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            animation: floatOrb 18s ease-in-out infinite;
            will-change: transform;
        }
        .bg-orb:nth-child(1) { width: 520px; height: 520px; background: radial-gradient(circle, #6c3ce0 0%, #3a1f8a 40%, transparent 70%); top: -120px; left: -80px; animation-delay: 0s; animation-duration: 20s; }
        .bg-orb:nth-child(2) { width: 440px; height: 440px; background: radial-gradient(circle, #e08850 0%, #b84520 40%, transparent 70%); top: 55%; right: -100px; animation-delay: -6s; animation-duration: 22s; }
        .bg-orb:nth-child(3) { width: 380px; height: 380px; background: radial-gradient(circle, #3b8de0 0%, #1a4f8a 40%, transparent 70%); bottom: -100px; left: 30%; animation-delay: -11s; animation-duration: 19s; }
        .bg-orb:nth-child(4) { width: 300px; height: 300px; background: radial-gradient(circle, #c05ad0 0%, #6b1f7a 40%, transparent 70%); top: 30%; left: 50%; animation-delay: -15s; animation-duration: 24s; }
        .bg-orb:nth-child(5) { width: 250px; height: 250px; background: radial-gradient(circle, #40c8a0 0%, #1a6b50 40%, transparent 70%); top: 10%; right: 25%; animation-delay: -3s; animation-duration: 21s; }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            15% { transform: translate(60px, -40px) scale(1.08); }
            30% { transform: translate(-30px, 50px) scale(0.94); }
            45% { transform: translate(-70px, -30px) scale(1.05); }
            60% { transform: translate(40px, 60px) scale(0.9); }
            75% { transform: translate(55px, -55px) scale(1.06); }
            90% { transform: translate(-50px, 35px) scale(0.96); }
        }
        .grain-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 180px 180px;
        }
        .app-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 0 20px;
        }
        .header {
            text-align: center;
            padding: 40px 20px 10px;
            position: relative;
            z-index: 3;
        }
        .header-icon {
            font-size: 48px;
            margin-bottom: 8px;
            display: inline-block;
            animation: gentlePulse 3s ease-in-out infinite;
        }
        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        .header h1 {
            font-family: var(--font-heading);
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e8e8f0 0%, #c0c0e0 40%, #a0c8f0 70%, #d0d0e8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .header .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            font-weight: 400;
        }
        .server-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffaa33;
            animation: dotBlink 1.5s ease-in-out infinite;
        }
        .status-dot.connected {
            background: #44eebb;
            animation: none;
            box-shadow: 0 0 10px rgba(68, 238, 187, 0.6);
        }
        .status-dot.error {
            background: #ff5566;
            animation: none;
            box-shadow: 0 0 8px rgba(255, 85, 102, 0.5);
        }
        @keyframes dotBlink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px 0 10px;
            position: relative;
            z-index: 3;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 13px 32px;
            border-radius: 50px;
            border: 1.5px solid var(--border-subtle);
            background: rgba(22, 22, 45, 0.5);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-family: var(--font-body);
            white-space: nowrap;
        }
        .tab-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(30, 30, 55, 0.6);
            color: #e0e0f0;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .tab-btn.active {
            background: rgba(40, 40, 70, 0.7);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }
        .tab-btn.active.tab-notes {
            border-color: var(--border-glow-notes);
            box-shadow: 0 0 30px var(--accent-notes-glow), 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .tab-btn.active.tab-notices {
            border-color: var(--border-glow-notices);
            box-shadow: 0 0 30px var(--accent-notices-glow), 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .tab-count {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 0.8rem;
            margin-left: 6px;
            font-weight: 500;
        }
        .tab-btn.active .tab-count {
            background: rgba(255, 255, 255, 0.2);
        }
        .cards-section {
            flex: 1;
            padding: 20px 0 40px;
            position: relative;
            z-index: 3;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 22px;
            padding: 0 10px;
        }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: 1fr; gap: 16px; }
            .header h1 { font-size: 2rem; }
            .tab-btn { padding: 11px 22px; font-size: 0.9rem; }
        }
        @media (min-width: 1400px) {
            .cards-grid { grid-template-columns: repeat(3, 1fr); }
        }
        .card {
            position: relative;
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            transition: var(--transition-smooth);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            min-height: 220px;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-card-hover);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .card.note-card:hover {
            border-color: var(--border-glow-notes);
            box-shadow: 0 0 40px var(--accent-notes-glow), var(--shadow-card-hover);
        }
        .card.notice-card:hover {
            border-color: var(--border-glow-notices);
            box-shadow: 0 0 40px var(--accent-notices-glow), var(--shadow-card-hover);
        }
        .card-bg-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.07;
            z-index: 0;
            transition: opacity 0.5s ease;
            border-radius: inherit;
            pointer-events: none;
        }
        .card:hover .card-bg-image { opacity: 0.12; }
        .card-accent {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            z-index: 1;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            opacity: 0.7;
            transition: opacity 0.3s ease, height 0.3s ease;
        }
        .note-card .card-accent { background: linear-gradient(90deg, #f0a850, #e07830, #f0a850); }
        .notice-card .card-accent { background: linear-gradient(90deg, #5b9cf5, #3b6fd0, #5b9cf5); }
        .card:hover .card-accent { opacity: 1; height: 4px; }
        .card-content {
            position: relative;
            z-index: 2;
            padding: 24px 22px 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
        }
        .card-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 4px 12px;
            border-radius: 20px;
            width: fit-content;
        }
        .note-card .card-badge { background: rgba(240, 168, 80, 0.15); color: #f0c070; }
        .notice-card .card-badge { background: rgba(91, 156, 245, 0.15); color: #8ab8ff; }
        .card-title {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 700;
            color: #f0f0f8;
            letter-spacing: -0.2px;
            line-height: 1.3;
            word-break: break-word;
        }
        .card-subject {
            font-size: 0.85rem;
            color: #c8c0e0;
            font-weight: 500;
            letter-spacing: 0.2px;
            background: rgba(255, 255, 255, 0.03);
            padding: 5px 10px;
            border-radius: 6px;
            width: fit-content;
        }
        .card-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.55;
            flex: 1;
            word-break: break-word;
            max-height: 180px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 8px;
        }
        
        /* Custom scrollbar styling */
        .card-description::-webkit-scrollbar {
            width: 6px;
        }
        
        .card-description::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        .card-description::-webkit-scrollbar-thumb {
            background: rgba(240, 168, 80, 0.4);
            border-radius: 3px;
            transition: background 0.3s ease;
        }
        
        .card-description::-webkit-scrollbar-thumb:hover {
            background: rgba(240, 168, 80, 0.7);
        }
        
        .notice-card .card-description::-webkit-scrollbar-thumb {
            background: rgba(91, 156, 245, 0.4);
        }
        
        .notice-card .card-description::-webkit-scrollbar-thumb:hover {
            background: rgba(91, 156, 245, 0.7);
        }
        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #8ab8ff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
            word-break: break-all;
            width: fit-content;
        }
        .card-link:hover { color: #b0d0ff; text-decoration: underline; }
        .card-link svg { width: 14px; height: 14px; flex-shrink: 0; }
        .card-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.2px;
            margin-top: auto;
            padding-top: 4px;
        }
        .card-time svg { width: 13px; height: 13px; flex-shrink: 0; opacity: 0.7; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; animation: floatOrb 6s ease-in-out infinite; }
        .empty-state h3 { font-size: 1.3rem; color: #c0c0d8; margin-bottom: 6px; font-weight: 600; }
        .empty-state p { font-size: 0.9rem; max-width: 400px; margin: 0 auto; line-height: 1.5; }
        .footer {
            text-align: center;
            padding: 24px 20px;
            position: relative;
            z-index: 3;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: auto;
        }
        .footer p { font-size: 0.82rem; color: var(--text-muted); letter-spacing: 0.3px; }
        .footer .copyright-highlight { color: #c0b8e8; font-weight: 600; }
        .footer .year { color: #e0c080; font-weight: 700; }
    </style>
</head>
<body>
    <div class="bg-animation-container">
        <div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-orb"></div>
    </div>
    <div class="grain-overlay"></div>

    <div class="app-wrapper">
        <header class="header">
            <div class="header-icon">📋</div>
            <h1>Notes & Notices</h1>
            <p class="subtitle">Here You Can See The Update</p>
            <div class="server-status" id="serverStatus" title="Data About Notice and Notes">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting to server...</span>
            </div>
        </header>

        <div class="tab-container">
            <button class="tab-btn tab-notes active" data-tab="notes" id="tabNotesBtn">
                📝 Notes <span class="tab-count" id="notesCount">0</span>
            </button>
            <button class="tab-btn tab-notices" data-tab="notices" id="tabNoticesBtn">
                📢 Notices <span class="tab-count" id="noticesCount">0</span>
            </button>
        </div>

        <section class="cards-section">
            <div class="cards-grid" id="cardsGrid"></div>
        </section>

        <footer class="footer">
            <p>
                © Copyrights <span class="copyright-highlight">All Rights Reserved</span>
                <span class="copyright-highlight">Suraj Kant</span>
                <span class="year">2026</span>
            </p>
        </footer>
    </div>

    <script>
        (function() {
            // ✅ Your deployed Google Apps Script URL
            const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz2dCgVAaKYlGfAwrIuIfkRFFZhjozBJddoiePMigJ1U-D2NcedSTrxOErHaK_o6LEQ/exec';

            // Background images pool for cards
            const cardBgImages = [
                'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop&auto=format',
                'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600&h=400&fit=crop&auto=format',
                'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&h=400&fit=crop&auto=format',
                'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&h=400&fit=crop&auto=format',
                'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop&auto=format',
                'https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=600&h=400&fit=crop&auto=format',
                'https://images.unsplash.com/photo-1532274402911-5a369e4c4bb5?w=600&h=400&fit=crop&auto=format',
                'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=600&h=400&fit=crop&auto=format',
                'https://images.unsplash.com/photo-1550684376-efcbd6e3f031?w=600&h=400&fit=crop&auto=format',
                'https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?w=600&h=400&fit=crop&auto=format',
                'https://images.unsplash.com/photo-1523712999610-f77fbcfc3843?w=600&h=400&fit=crop&auto=format',
                'https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?w=600&h=400&fit=crop&auto=format',
            ];
            function getRandomBgImage() {
                return cardBgImages[Math.floor(Math.random() * cardBgImages.length)];
            }

            // State
            let currentTab = 'notes';
            let notesData = [];
            let noticesData = [];

            // DOM elements
            const cardsGrid = document.getElementById('cardsGrid');
            const tabNotesBtn = document.getElementById('tabNotesBtn');
            const tabNoticesBtn = document.getElementById('tabNoticesBtn');
            const notesCountEl = document.getElementById('notesCount');
            const noticesCountEl = document.getElementById('noticesCount');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            // Helper: escape HTML
            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // Format date nicely
            function formatDateNice(dateStr) {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const month = months[d.getMonth()];
                const day = d.getDate();
                const year = d.getFullYear();
                //let hours = d.getHours();
                //const minutes = d.getMinutes().toString().padStart(2, '0');
                //const ampm = hours >= 12 ? 'PM' : 'AM';
                //hours = hours % 12 || 12;
                return `${month} ${day}, ${year}`;
                   //  return `${month} ${day}, ${year} at ${hours}:${minutes} ${ampm}`;
            }

            // Update server status indicator
            function updateServerStatus(state, message) {
                statusText.textContent = message;
                statusDot.className = 'status-dot';
                if (state === 'connected') statusDot.classList.add('connected');
                else if (state === 'error') statusDot.classList.add('error');
            }

            // Fetch data from Google Apps Script
            async function fetchSheetData() {
                try {
                    updateServerStatus('loading', 'Fetching data...');
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const json = await response.json();
                    updateServerStatus('connected', 'Data loaded successfully');
                    return json;
                } catch (err) {
                    console.error('Fetch failed:', err);
                    updateServerStatus('error', 'Failed to load data');
                    return null;
                }
            }

            // Store background images for each card to prevent refreshing
            const cardBgImageMap = new Map();

            // Render cards based on current tab
            function renderCards() {
                cardsGrid.innerHTML = '';
                const data = currentTab === 'notes' ? notesData : noticesData;

                if (!data || data.length === 0) {
                    const emptyState = document.createElement('div');
                    emptyState.className = 'empty-state';
                    const icon = currentTab === 'notes' ? '📝' : '📢';
                    const msg = currentTab === 'notes' ? 'No notes found in the sheet.' : 'No notices found in the sheet.';
                    emptyState.innerHTML = `<div class="empty-icon">${icon}</div><h3>Nothing here yet</h3><p>${msg}</p>`;
                    cardsGrid.appendChild(emptyState);
                } else {
                    data.forEach((item, index) => {
                        const card = document.createElement('div');
                        card.className = `card ${currentTab === 'notes' ? 'note-card' : 'notice-card'}`;
                        
                        // Use stored background image or generate a new one
                        const cardKey = `${currentTab}_${index}`;
                        let bgImg = cardBgImageMap.get(cardKey);
                        if (!bgImg) {
                            bgImg = getRandomBgImage();
                            cardBgImageMap.set(cardKey, bgImg);
                        }
                        
                        const title = item.title || 'Untitled';
                        const description = item.description || '';
                        const link = item.link || '';
                        const subject = item.subject || '';
                        const date = item.date || '';
                        const timeDisplay = formatDateNice(date);

                        let cardHTML = `
                            <div class="card-bg-image" style="background-image: url('${bgImg}'); background-color: #1a2038;" aria-hidden="true"></div>
                            <div class="card-accent"></div>
                            <div class="card-content">
                                <span class="card-badge">${currentTab === 'notes' ? '📝 Note' : '📢 Notice'}</span>
                                <h3 class="card-title">${escapeHTML(title)}</h3>
                        `;
                        if (currentTab === 'notes' && subject) {
                            cardHTML += `<span class="card-subject">📌 ${escapeHTML(subject)}</span>`;
                        }
                        cardHTML += `<p class="card-description">${escapeHTML(description)}</p>`;
                        if (link) {
                            cardHTML += `
                                <a href="${escapeHTML(link)}" class="card-link" target="_blank" rel="noopener" onclick="event.stopPropagation();">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                    ${escapeHTML(link.length > 35 ? link.substring(0, 35) + '...' : link)}
                                </a>
                            `;
                        }
                        if (date) {
                            cardHTML += `
                                <div class="card-time" title="${timeDisplay}">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                    ${timeDisplay}
                                </div>
                            `;
                        }
                        cardHTML += `</div>`;
                        card.innerHTML = cardHTML;
                        cardsGrid.appendChild(card);
                    });
                }
                notesCountEl.textContent = notesData.length;
                noticesCountEl.textContent = noticesData.length;
            }

            // Switch between Notes and Notices tabs
            function switchTab(tab) {
                currentTab = tab;
                tabNotesBtn.classList.toggle('active', tab === 'notes');
                tabNoticesBtn.classList.toggle('active', tab === 'notices');
                renderCards();
            }

            tabNotesBtn.addEventListener('click', () => switchTab('notes'));
            tabNoticesBtn.addEventListener('click', () => switchTab('notices'));

            // Initial load
            async function init() {
                const json = await fetchSheetData();
                if (json) {
                    notesData = Array.isArray(json.notes) ? json.notes : [];
                    noticesData = Array.isArray(json.notices) ? json.notices : [];
                } else {
                    notesData = [];
                    noticesData = [];
                }
                renderCards();
            }

            // ❌ REMOVED: Auto refresh disabled - cards will load once and stay stable
            // To enable refresh in future, uncomment below and adjust interval as needed:
            // setInterval(async () => {
            //     const json = await fetchSheetData();
            //     if (json) {
            //         notesData = Array.isArray(json.notes) ? json.notes : [];
            //         noticesData = Array.isArray(json.notices) ? json.notices : [];
            //         renderCards();
            //     }
            // }, 300000); // 300000 ms = 5 minutes

            init();
        })();
    </script>
</body>
